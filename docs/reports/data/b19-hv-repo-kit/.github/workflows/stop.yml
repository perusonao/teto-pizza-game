name: Stop B19 HV site (replace with a closed page)
# Replaces the published site with a static "closed" page (no app, no save access). Then delete the repo or unpublish Pages in Settings.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type STOP'
        required: true
permissions:
  contents: read
jobs:
  stop:
    if: ${{ inputs.confirm == 'STOP' }}
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write, contents: read }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: site-stop }
      - id: deployment
        uses: actions/deploy-pages@v4
