<!doctype html><meta charset=utf-8><style>
body{margin:0;padding:14px;font:13px/1.3 sans-serif;background:#fff;color:#222;width:1180px}
h1{font-size:18px;margin:0 0 4px}p{margin:2px 0 10px;color:#555}
table{border-collapse:collapse}td,th{padding:3px 6px;vertical-align:middle}
th{font-weight:600;font-size:12px;text-align:center}td.l{width:150px;font-size:12px}
.bg{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 10px;border-radius:8px;height:34px}
.tomato{background:#d9503a}.dark{background:#1b1d24}.tray{background:#fff6e3}.gray{background:#d9503a;filter:grayscale(1)}
.mix{gap:2px}
img{display:block}
</style>
<h1>#703 クリームチーズ C0 / C1 / C3 — 暗い背景・白チーズ並置（補足シート）</h1>
<p>C0=現行(#701) / C1=下半分だけ銀紙 / C3=色だけ温かい白。サイズ 20/24/28/29(RESULT相当) CSS px。参考: feta / ricotta / mozzarella（Style Lock 参照 SVG）。docs 用候補で本番コードではない。</p>
<table id=t></table>
<script>
const rows=[['C0 現行','cream-C0-current'],['C1 むきかけ','cream-C1-half-unwrapped'],['C3 色のみ','cream-C3-color-only'],['参考 feta','feta'],['参考 ricotta','ricotta'],['参考 mozzarella','mozzarella']];
const cols=[['トマト上(焼成後)','tomato'],['暗い背景','dark'],['トレイ(クリーム)','tray'],['グレースケール','gray']];
const sizes=[20,24,28,29];
let h='<tr><th></th>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr>';
for(const [n,f] of rows){h+=`<tr><td class=l>${n}</td>`+cols.map(c=>`<td><div class="bg ${c[1]}">${sizes.map(s=>`<img src="${f}.svg" width=${s} height=${s}>`).join('')}</div></td>`).join('')+'</tr>'}
h+='<tr><td class=l>並置(24px・近接)</td>'+cols.map(c=>`<td><div class="bg ${c[1]} mix">${['cream-C0-current','cream-C1-half-unwrapped','cream-C3-color-only','feta','ricotta','mozzarella'].map(f=>`<img src="${f}.svg" width=24 height=24>`).join('')}</div></td>`).join('')+'</tr>';
document.getElementById('t').innerHTML=h;
</script>
