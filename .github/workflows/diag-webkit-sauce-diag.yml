name: Diag WebKit sauce diagnostic (temporary, session branch only)

# Temporary: runs the sauce-diagnostic spec and the settings dev-link spec on WebKit for the session branch. Not part of any PR; delete with the branch.
on:
  push:
    branches: [claude/multi-sauce-pizza-recipes-frhvhs]
    paths: [".github/workflows/diag-webkit-sauce-diag.yml", "e2e/sauce-diag.spec.ts", "e2e/sauce-oil-over-519.spec.ts", "src/devtools/**", "src/App.tsx", "src/App.css"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    strategy:
      fail-fast: false
      matrix:
        project: [webkit-390x844, webkit-360x800]
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Sauce diagnostic + settings dev link (WebKit)
        run: npx playwright test e2e/sauce-diag.spec.ts e2e/settings-dev-editor-link.spec.ts e2e/sauce-oil-over-519.spec.ts --project=${{ matrix.project }} --reporter=list
