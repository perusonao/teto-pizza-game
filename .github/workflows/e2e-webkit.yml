name: E2E WebKit (Cooking UI 1-Screen)

# Issue #167 PR-C (Verification Hardening). Phase 0/PR-A found the *only* Playwright coverage
# this repo had (e2e/*.spec.ts, playwright.config.ts) ran entirely on Desktop Chrome -- a real
# iPhone Safari user still hit horizontal tab-strip clipping, vertical Cooking UI scroll, and
# Reference/PizzaStage divergence that Chromium's own layout engine never reproduced. This is a
# dedicated, WebKit-only job (not folded into ci.yml's fast lint/vitest/build job, and not a
# blind Chromium+WebKit x every-spec matrix) so a future change that only breaks Safari's own
# layout/font/emoji metrics -- not Chromium's -- still fails CI before merge, without slowing
# down every PR's fast feedback loop with a second full browser matrix it doesn't need.
#
# Issue #201 (A1/A2): the workflow still TRIGGERS on every PR to main -- never a top-level
# `paths:` filter, which would leave a required check with no result at all ("Expected -- Waiting
# for status") on a docs-only PR. Instead, three jobs:
#
#   classify     -- lightweight (no npm ci): diffs the PR and outputs webkit_required=true|false
#                   plus a human-readable reason (scripts/ci/classify-webkit-pr.sh). Only
#                   documentation paths (docs/**, **/*.md outside runtime trees) may skip; every
#                   other/unknown path, and every classifier error, resolves to true (fail-safe).
#   webkit       -- Full WebKit E2E: every e2e spec at 390x844 + 360x800. Runs unless classify
#                   explicitly succeeded with "false".
#   webkit-gate  -- "WebKit Gate", always runs and always reports a conclusion. This is the check
#                   to mark as required in branch protection / rulesets. It fails when WebKit was
#                   required and did not succeed (failed, cancelled, timed out, or skipped).
#
# Issue #207 Phase 2A (coverage unchanged, wall-clock ~halved): `webkit` is a STATIC 4-job matrix
# -- {webkit-390x844, webkit-360x800} x {--shard 1/2, 2/2} -- instead of one runner running both
# projects on 2 workers. Each runner keeps Playwright's default 2 workers (no extra CPU contention
# for timing-sensitive tests). The matrix is static (never built from classify outputs), so a
# failed classify still gets a real Full run. Each shard records evidence (its project's full
# `--list` selection + its own JSON results, scripts/ci/webkit-shard-evidence.mjs), and WebKit
# Gate only passes when every shard job succeeded AND the evidence proves every listed test ran
# exactly once, passed, and both viewports listed the same tests. Also new in Phase 2A:
#   - push to main  -> Full WebKit after every merge (post-merge backstop; also writes the
#                      Playwright browser cache in main's scope, so PR runs can restore it)
#   - workflow_dispatch -> manual Full WebKit on any ref
#   - PR label `webkit-full` -> forces Full (read at run time; see classify-webkit-pr.sh)
# All three events share the same classify -> webkit -> WebKit Gate jobs; only classify's
# decision differs.
#
# Issue #207 Phase 2B (coverage unchanged, wall-clock + skip precision):
#   - Balanced shards: Phase 2A's `--shard i/2` split by test COUNT, leaving ~65% of the
#     test-seconds in shard 1/2 (it set the wall-clock). Each shard now runs whole spec files
#     assigned by measured duration (scripts/ci/webkit-shard-plan.mjs + webkit-spec-weights.json).
#     The shard still lists the project's FULL selection and WebKit Gate's evidence check is
#     unchanged, so a wrong plan can only turn the gate red, never green.
#   - Non-browser skip: besides docs, PRs/increments touching only offline tools/**/*.py scripts
#     or src/** Vitest files skip WebKit, but only when classify-webkit.mjs's repository scan
#     proves nothing the browser/E2E suite loads references them (else: Full, fail-safe).
#   - Not in Phase 2B: affected-spec / single-viewport selection. With 4 parallel shards neither
#     shortens the wall-clock enough to justify the coverage risk; see
#     docs/reports/TETO_DEV-CI_WEBKIT-PHASE2B_Result.md.
#
# The original rationale above still holds for runtime changes: a shared CSS variable, App.css
# primitive, or reducer change is NOT documentation, so it always runs WebKit. Only changes that
# cannot reach the browser (Markdown/docs, report screenshots under docs/) skip it.
#
# Rollback: `git revert` the Issue #207 Phase 2A commit restores the single `webkit` job (the
# `WebKit Gate` name is unchanged, so a requirement on it needs no change). If the per-shard
# `webkit ...` check names were ever made required, switch that requirement back to WebKit Gate.
# See docs/reports/TETO_DEV-CI_WEBKIT-PHASE2A_Result.md (and, for #201,
# docs/reports/TETO_DEV-CI_WEBKIT-CONDITIONAL_A1A2_Result.md).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PRs: one group per PR, and a new push cancels the superseded commit's still-running run (a
# cancelled shard can only turn WebKit Gate red, never green -- see scripts/ci/webkit-gate.sh).
# push/workflow_dispatch: one group per commit and never cancelled, so every merge to main gets
# its own complete post-merge Full run and PR runs can never cancel it (or vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read # look up the previous head's WebKit Gate result (evidence reuse)
      pull-requests: read # live read of the `webkit-full` label
    outputs:
      webkit_required: ${{ steps.classify.outputs.webkit_required }}
      reason: ${{ steps.classify.outputs.reason }}
      tested_base: ${{ steps.classify.outputs.tested_base }}
    steps:
      # Full history (for merge-base and the previous head) but no file contents beyond what the
      # checkout itself needs -- `git diff --name-only` only reads trees.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/classify-webkit-pr.sh

  webkit:
    name: webkit ${{ matrix.project }} shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: classify
    # `!cancelled()` (not the default success()) so a FAILED classify still runs WebKit: only an
    # explicit, successful "false" skips it.
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.webkit_required != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard always finishes, so one failing test never hides another shard's results.
      # (WebKit Gate fails on any non-success shard either way.)
      fail-fast: false
      # Static on purpose -- see the header. `total` must equal the number of `shard` values;
      # WebKit Gate's evidence check fails if any shard 1..total is missing or duplicated.
      # (Since Phase 2B `shard`/`total` feed webkit-shard-plan.mjs, not Playwright's --shard.)
      matrix:
        project: [webkit-390x844, webkit-360x800]
        shard: [1, 2]
        total: [2]
    env:
      LIST_JSON: ${{ github.workspace }}/../webkit-list.json
      RESULTS_JSON: ${{ github.workspace }}/../webkit-results.json
      PLAN_ARGS: ${{ github.workspace }}/../webkit-shard-args.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Browser binaries are the one large, cacheable artifact this job downloads -- system
      # package deps (--with-deps, below) are OS-level and not meaningfully cacheable across
      # runners, so only ~/.cache/ms-playwright is cached, keyed on the exact Playwright version
      # (package-lock.json) so a Playwright bump always fetches the matching browser build
      # instead of silently reusing a stale cached one. PR-scoped caches are only visible to that
      # PR; the push-to-main run writes the entry every PR can restore.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Official supported installation path (README/Playwright docs): --with-deps additionally
      # installs the Ubuntu system libraries WebKit needs to actually launch, not just the
      # browser binary itself -- a bare `install webkit` on a fresh runner reliably fails to
      # launch without this.
      - name: Install WebKit (with system deps)
        run: npx playwright install --with-deps webkit

      # Evidence for the Result Report's "actual WebKit execution proof" requirement -- a green
      # job alone doesn't prove WebKit launched (it could have silently no-opped). This prints
      # the resolved Playwright version and the actual installed WebKit revision directory.
      - name: Browser installation proof
        run: |
          npx playwright --version
          find ~/.cache/ms-playwright -maxdepth 1 -type d -iname 'webkit-*'

      # The coverage contract: this project's FULL selection (no --shard), i.e. every spec in
      # e2e/. WebKit Gate checks that the shards together executed exactly this list.
      - name: List full selection (${{ matrix.project }})
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ env.LIST_JSON }}
        run: |
          npx playwright test --list --project=${{ matrix.project }} --reporter=json > /dev/null
          npx playwright test --list --project=${{ matrix.project }} | tail -n 1

      # Issue #207 Phase 2B: this shard's spec files, balanced by measured duration over the full
      # selection just listed. Every job computes the same deterministic plan; an empty shard is
      # an error (Playwright without a file filter would run the whole suite).
      - name: Plan shard (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.total }})
        run: >-
          node scripts/ci/webkit-shard-plan.mjs --list "$LIST_JSON" --project ${{ matrix.project }}
          --shard ${{ matrix.shard }} --total ${{ matrix.total }}
          --weights scripts/ci/webkit-spec-weights.json --out "$PLAN_ARGS"

      # One project per job, one shard of it: every spec in e2e/ is still covered by the 2 shards
      # of each of the 2 projects (playwright.config.ts webkit-390x844 / webkit-360x800, both
      # Desktop Safari = WebKit). The [webkit-...] prefix on every test line of the `list`
      # reporter is itself proof WebKit -- not Chromium -- executed each test.
      - name: Run WebKit e2e (${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ env.RESULTS_JSON }}
        run: |
          mapfile -t spec_filters < "$PLAN_ARGS"
          if [ "${#spec_filters[@]}" -eq 0 ]; then
            echo "::error::empty shard plan -- refusing to run without a file filter"; exit 1
          fi
          npx playwright test --project=${{ matrix.project }} --reporter=list,html,json "${spec_filters[@]}"

      # always(): a failed/partial run still records what did (not) run. A missing file is
      # recorded as an error inside the evidence, which fails WebKit Gate.
      - name: Record shard evidence
        if: always()
        run: >-
          node scripts/ci/webkit-shard-evidence.mjs collect
          --project ${{ matrix.project }} --shard ${{ matrix.shard }} --total ${{ matrix.total }}
          --list "$LIST_JSON" --results "$RESULTS_JSON"
          --out webkit-evidence/evidence.json

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-evidence-${{ matrix.project }}-shard${{ matrix.shard }}
          path: webkit-evidence/evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-webkit-report-${{ matrix.project }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  webkit-gate:
    name: WebKit Gate
    needs: [classify, webkit]
    # always(): the gate must report a conclusion in every case, including when `webkit` was
    # skipped, failed, or cancelled -- a skipped gate would read as "success" to branch protection.
    # Every step below is also `if: always()`, so a cancelled run cannot skip the evaluation and
    # leave an empty, green gate job behind.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out CI scripts
        if: always()
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22

      # `needs.webkit.result` is the aggregate of every matrix shard (any failed/cancelled shard
      # -> not success). The evidence then proves the shards jointly covered the whole suite.
      # continue-on-error: a missing artifact must surface as a gate FAIL with a readable reason
      # from the verifier, not abort the evaluation step.
      - name: Download shard evidence
        if: ${{ always() && needs.webkit.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: webkit-evidence-*
          path: webkit-evidence

      - name: Evaluate WebKit requirement
        if: always()
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WEBKIT_REQUIRED: ${{ needs.classify.outputs.webkit_required }}
          REASON: ${{ needs.classify.outputs.reason }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
          TESTED_BASE: ${{ needs.classify.outputs.tested_base }}
          EVIDENCE_DIR: webkit-evidence
          REQUIRED_PROJECTS: webkit-390x844 webkit-360x800
        run: bash scripts/ci/webkit-gate.sh
