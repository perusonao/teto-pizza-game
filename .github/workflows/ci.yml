name: CI

on:
  pull_request:
    branches: [main, codex/step-order-phase1]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA to check out and verify
        required: true
        type: string

# Issue #201: one group per PR -- a new push cancels the superseded commit's run. A manual run is
# isolated by its requested SHA and is never cancelled by a PR run (or vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('dispatch-{0}', inputs.target_sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI optimization Phase 1: a documentation-only pull request skips npm ci / lint / Vitest / build.
  #
  # The `build` job is the required check and it ALWAYS runs and always reports a conclusion: there is
  # no `paths` / `paths-ignore` filter on the trigger and no job-level `if`, so the check can never stay
  # "Expected". Only the heavy STEPS are skipped, by a per-step condition on the classifier's output.
  # Fail-safe: any change outside docs Markdown / docs images / root Markdown (src, tests, tools,
  # scripts, workflows, config, lockfiles, docs JSON that tests import, ...) -- and any classifier
  # failure or empty output -- leaves `docs_only` != 'true', so every step runs exactly as before.
  # scripts/ci/test-ci-docs-only.sh pins these invariants (including this file's own shape).
  # Test speed-up: the full Vitest run is split with `--shard i/N` over parallel runners (the pattern of e2e-webkit.yml). Same coverage: every shard runs the
  # whole project list (default + hand-on-9 / hand-on-12 / hand-off) restricted to its slice, so the union of the shards is exactly `npm test`.
  # Each shard repeats the build job's checkout / SHA verification / docs-only classifier so a docs-only PR skips `npm ci` and Vitest here too, and the
  # shard still reports a (green) conclusion. `Vitest Gate` below is the check to require: it fails unless every shard succeeded.
  vitest:
    name: vitest shard ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-24.04
    strategy:
      # Every shard always finishes, so one failing test never hides another shard's results.
      fail-fast: false
      # Static on purpose: `total` must equal the number of `shard` values.
      matrix:
        shard: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 2
      - name: Verify checkout SHA
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "checked_out_sha=$actual_sha"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            exit 0
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$actual_sha" != "${TARGET_SHA,,}" ]; then
            echo "::error title=Checkout SHA mismatch::requested $TARGET_SHA but checked out $actual_sha"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Classify the change (docs-only?)
        id: classify
        # A crash here must not turn into a skip or a failure: no output -> the heavy steps run.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/classify-ci-docs-only.sh
      - name: npm ci
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: npm ci
      - name: Vitest (shard)
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: npx vitest run --shard ${{ matrix.shard }}/${{ matrix.total }}

  # "Vitest Gate": always runs and always reports a conclusion (like WebKit Gate). It replaces the Vitest step that used to sit in `build`: require THIS check
  # in branch protection. It fails when any shard failed, was cancelled or was skipped.
  vitest-gate:
    name: Vitest Gate
    needs: vitest
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Vitest shard to succeed
        env:
          VITEST_RESULT: ${{ needs.vitest.result }}
        run: |
          echo "vitest shards result: $VITEST_RESULT"
          [ "$VITEST_RESULT" = "success" ]

  build:
    # Pinned (2026-11-10): `ubuntu-latest` moved to Ubuntu 26.04, where Playwright 1.56.1 cannot install its browsers and the apt process checks of
    # scripts/ci/test-webkit-ci.sh fail. Move this pin only together with a Playwright version that supports the newer image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit plus both parents: enough to list exactly what the PR changes
          # (`git diff HEAD^1 HEAD`). A manual run instead checks out the required exact SHA.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 2

      - name: Verify and report checkout SHA
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "event_name=$EVENT_NAME"
          echo "workflow_ref=$WORKFLOW_REF"
          echo "workflow_sha=$WORKFLOW_SHA"
          echo "requested_target_sha=${TARGET_SHA:-<pull_request merge ref>}"
          echo "checked_out_sha=$actual_sha"
          {
            echo "### CI checkout identity"
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| event | \`$EVENT_NAME\` |"
            echo "| workflow ref | \`$WORKFLOW_REF\` |"
            echo "| workflow SHA | \`$WORKFLOW_SHA\` |"
            echo "| requested target | \`${TARGET_SHA:-pull_request merge ref}\` |"
            echo "| checked out SHA | \`$actual_sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            exit 0
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error title=Invalid target SHA::target_sha must be exactly 40 hexadecimal characters"
            exit 1
          fi
          if [ "$actual_sha" != "${TARGET_SHA,,}" ]; then
            echo "::error title=Checkout SHA mismatch::requested $TARGET_SHA but checked out $actual_sha"
            exit 1
          fi
          echo "Exact target SHA verified: $actual_sha"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Classify the change (docs-only?)
        id: classify
        # A crash here must not turn into a skip or a failure: no output -> the heavy steps run.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/classify-ci-docs-only.sh

      - name: npm ci
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: npm ci
      # Issue #207: hermetic tests for the WebKit Gate / classifier / shard-evidence scripts, so a
      # regression in the gate logic fails fast here instead of only surfacing inside a WebKit run.
      - name: WebKit CI scripts tests
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: bash scripts/ci/test-webkit-ci.sh
      # CI optimization Phase 1: the docs-only classifier, its driver and this workflow's invariants.
      - name: CI docs-only classifier tests
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: bash scripts/ci/test-ci-docs-only.sh
      - name: Lint
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: npm run lint
      # Vitest runs in the sharded `vitest` job below (checked by `Vitest Gate`); it no longer runs in this job.
      - name: Build
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: npm run build
