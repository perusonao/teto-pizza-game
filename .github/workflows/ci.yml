name: CI

on:
  pull_request:
    branches: [main]

# Issue #201: one group per PR -- a new push cancels the superseded commit's run. This workflow
# only triggers on pull_request, so main and other PRs never share a group.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Issue #207: hermetic tests for the WebKit Gate / classifier / shard-evidence scripts, so a
      # regression in the gate logic fails fast here instead of only surfacing inside a WebKit run.
      - name: WebKit CI scripts tests
        run: bash scripts/ci/test-webkit-ci.sh
      - run: npm run lint
      - run: npm test
      - run: npm run build
