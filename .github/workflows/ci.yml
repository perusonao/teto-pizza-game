name: CI

on:
  pull_request:
    branches: [main]

# Issue #201: one group per PR -- a new push cancels the superseded commit's run. This workflow
# only triggers on pull_request, so main and other PRs never share a group.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
