name: Diag WebKit 524 (temporary, diagnostic only)

# Temporary diagnostic for the #524 Owner HV FAIL (Owner-approved). Runs ONE spec (e2e/zz-diag-524.spec.ts, taken from this branch) on WebKit
# against two source trees with the same conditions: #524 HEAD a74b1f7 and main. Prints canvas facts + rendered samples + small JPEGs.
# Lives only on claude/multi-sauce-pizza-recipes-frhvhs; not part of any PR.
on:
  push:
    branches: [claude/multi-sauce-pizza-recipes-frhvhs]
    paths: [".github/workflows/diag-webkit-524.yml", "e2e/zz-diag-524.spec.ts"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pr524-a74b1f7
            ref: a74b1f7ae8aa3c66d243be5d8ce0c549ccf7c8d3
          - name: main
            ref: main
    name: diag ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: diag
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: src
      - run: cp diag/e2e/zz-diag-524.spec.ts src/e2e/zz-diag-524.spec.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
        working-directory: src
      - run: npx playwright install --with-deps webkit
        working-directory: src
      - name: Source under test
        working-directory: src
        run: git rev-parse HEAD
      - name: Diagnostic spec (WebKit 390x844)
        working-directory: src
        run: npx playwright test e2e/zz-diag-524.spec.ts --project=webkit-390x844 --reporter=list
