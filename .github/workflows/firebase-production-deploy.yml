name: Firebase Production Deploy

# Firebase Production Deploy via GitHub Actions (Issue #134). Authority:
# docs/design/TETO_FIREBASE-GITHUB-ACTIONS-PRODUCTION-DEPLOY_1.0.md
#
# Manual, gated production deploy of Cloud Functions and/or Firestore rules/indexes to the
# `teto-pizza-game` Firebase project. Firebase Hosting is never deployed here -- production
# hosting is GitHub Pages, via the separate `deploy.yml` workflow.
#
# Authentication is GitHub OIDC -> Workload Identity Federation (google-github-actions/auth).
# No long-lived Google credential is stored in this repository. See design doc sections 4-5 for
# the authentication/IAM rationale.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (verify = read-only WIF/auth check, no build/test/deploy step runs at all)"
        type: choice
        options: [functions, firestore, all, verify]
        default: functions

permissions:
  contents: read
  id-token: write # required for GitHub OIDC / Workload Identity Federation

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false # never cancel a deploy already in flight

env:
  # Hardcoded constant, never a workflow_dispatch input -- the operator cannot type (or
  # mistype) a different project id at dispatch time. Design doc section 8 (project-ID guard).
  FIREBASE_PROJECT_ID: teto-pizza-game
  # Pinned, not `npx firebase-tools@latest` -- see the "Install firebase-tools" step below for
  # why an unpinned CLI version is not acceptable for a production deploy pipeline.
  FIREBASE_TOOLS_VERSION: "15.26.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # gates on required reviewer + branch policy (main only)
    steps:
      - name: Guard against non-main ref
        # Belt-and-suspenders on top of the `production` Environment's own deployment-branch-policy
        # (restricted to `main`, design doc section 12) -- an Environment setting could in
        # principle be misconfigured later; this workflow does not rely on that setting alone.
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow must run against refs/heads/main only. Got: ${{ github.ref }}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SA_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install firebase-tools
        # Installed globally, pinned to an exact version (env.FIREBASE_TOOLS_VERSION) rather than
        # `npx firebase-tools@latest` -- an unpinned CLI could silently change deploy behavior on
        # a future run with no corresponding code change to review. Not a project devDependency
        # of either package.json: this CLI is needed regardless of which `target` is chosen
        # (functions deploy, firestore deploy, and the project-ID guard preflight below all use
        # it), so it is not coupled to either subproject's own dependency tree.
        run: npm install -g "firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}"

      - name: Project-ID guard (preflight)
        # Confirms the WIF-derived identity actually has access to exactly this project id
        # before any install/build/deploy step runs. Design doc section 8. `.firebaserc` does
        # not exist in CI (gitignored) and is never relied on -- every `firebase` invocation in
        # this workflow passes `--project "$FIREBASE_PROJECT_ID"` explicitly.
        #
        # This step alone is also `target: verify`'s entire purpose: a real, live,
        # production-safe proof that GitHub OIDC -> Workload Identity Federation ->
        # google-github-actions/auth -> this exact service account can authenticate and read
        # (never write) against `teto-pizza-game`, with no build/test/deploy step reachable
        # afterward for that target value (every step below this one is gated on
        # `target == 'functions' | 'firestore' | 'all'`, which `verify` never matches).
        run: firebase projects:list --project "$FIREBASE_PROJECT_ID"

      - name: npm ci (root)
        # Needed for both branches below: the `src/shared` test (functions/all) and the
        # Firestore rules emulator test's own dependencies (`@firebase/rules-unit-testing`,
        # vitest.rules.config.ts) (firestore/all). Skipped for `verify`, which needs neither.
        if: ${{ inputs.target != 'verify' }}
        run: npm ci

      - name: functions -- npm ci
        if: ${{ inputs.target == 'functions' || inputs.target == 'all' }}
        run: npm ci
        working-directory: functions

      - name: functions -- typecheck
        if: ${{ inputs.target == 'functions' || inputs.target == 'all' }}
        run: npm run typecheck
        working-directory: functions

      - name: functions -- lint
        if: ${{ inputs.target == 'functions' || inputs.target == 'all' }}
        run: npm run lint
        working-directory: functions

      - name: functions -- test
        if: ${{ inputs.target == 'functions' || inputs.target == 'all' }}
        run: npm test
        working-directory: functions

      - name: functions -- build
        if: ${{ inputs.target == 'functions' || inputs.target == 'all' }}
        run: npm run build
        working-directory: functions

      - name: root -- src/shared scoped test
        # functions/ imports src/shared/lunchRushScoring.ts and src/shared/lunchRushPeriodIds.ts
        # at build time (design doc section 7) -- the one root-level dependency a backend-only
        # deploy actually needs covered. Deliberately NOT the full root suite (2000+ tests) --
        # see this file's own header and design doc section 7 for why that is out of scope here.
        if: ${{ inputs.target == 'functions' || inputs.target == 'all' }}
        run: npx vitest run src/shared

      - name: firestore -- rules emulator test
        # The one gate that actually exercises the rule text before it goes live. Design doc
        # section 7.
        if: ${{ inputs.target == 'firestore' || inputs.target == 'all' }}
        run: npx firebase-tools emulators:exec --only firestore --project "$FIREBASE_PROJECT_ID" "npx vitest run --config vitest.rules.config.ts"

      - name: Deploy -- functions
        id: deploy_functions
        if: ${{ inputs.target == 'functions' || inputs.target == 'all' }}
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy -- firestore (rules + indexes)
        id: deploy_firestore
        # Only reached if the functions deploy step above succeeded (default GitHub Actions
        # step-failure behavior: a failed step stops the job, later steps are skipped) --
        # `all` is explicitly non-atomic, never a single combined `--only functions,firestore:...`
        # call. Design doc sections 6/9/10.
        if: ${{ inputs.target == 'firestore' || inputs.target == 'all' }}
        run: firebase deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Firebase Production Deploy"
            echo ""
            echo "Target: \`${{ inputs.target }}\`"
            echo "Project: \`$FIREBASE_PROJECT_ID\`"
            echo ""
            echo "| Deploy step | Ran | Outcome |"
            echo "|---|---|---|"
            echo "| functions | ${{ (inputs.target == 'functions' || inputs.target == 'all') && 'yes' || 'no' }} | ${{ steps.deploy_functions.outcome || 'skipped' }} |"
            echo "| firestore (rules + indexes) | ${{ (inputs.target == 'firestore' || inputs.target == 'all') && 'yes' || 'no' }} | ${{ steps.deploy_firestore.outcome || 'skipped' }} |"
            echo ""
            if [ "${{ inputs.target }}" = "verify" ]; then
              echo "**Read-only WIF/auth verification only.** No build, test, or deploy step ran."
              echo "If the \"Project-ID guard (preflight)\" step above succeeded, GitHub OIDC ->"
              echo "Workload Identity Federation -> google-github-actions/auth -> the"
              echo "\`github-actions-deploy\` service account successfully authenticated and read"
              echo "(never wrote) against \`teto-pizza-game\`."
            fi
            if [ "${{ inputs.target }}" = "all" ]; then
              echo "\`all\` is explicitly non-atomic: functions and firestore are two independent"
              echo "deploy steps. If functions succeeded and firestore failed (or was skipped due"
              echo "to an earlier failure), this is a genuine partial-deploy state -- re-dispatch"
              echo "with target: firestore once the underlying issue is fixed; functions does not"
              echo "need to be redeployed again. See design doc section 10."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
