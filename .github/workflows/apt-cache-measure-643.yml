name: Apt cache measure 643 (temporary, measurement only)

# #643 experiment (Owner-approved): how much does an apt .deb cache change the cost of Playwright's WebKit system-deps install, and does the install
# fall back cleanly when the cache is corrupt / stale / empty? Lives ONLY on branch claude/apt-cache-measure-643 -- never merged, not part of any PR,
# does not touch e2e-webkit.yml / install-with-retry.sh. It installs system deps only (`playwright install-deps webkit`); no tests run, nothing is deployed.
on:
  push:
    branches: [claude/apt-cache-measure-643]
    paths: [".github/workflows/apt-cache-measure-643.yml", "scripts/ci/_experiments/apt-measure.sh"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHE_PATH: ~/apt-archives/*.deb

jobs:
  # A: today's behaviour. apt's own archive dir, no cache.
  baseline:
    name: A baseline (no cache)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: bash scripts/ci/_experiments/apt-measure.sh baseline default

  # B: cold install into a runner-owned archive dir, then save the .debs. Restores first, so a re-run shows a cross-run hit.
  populate:
    name: B cold install + save cache
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: echo "IMGV=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - run: echo "T_RESTORE0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Restore apt archives (a hit here means an earlier run saved them)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: apt-measure-643-${{ runner.os }}-${{ env.IMGV }}-${{ hashFiles('package-lock.json') }}
      - run: |
          echo "restore: cache-hit=${{ steps.restore.outputs.cache-hit }} matched=${{ steps.restore.outputs.cache-matched-key }} seconds=$(awk -v a=$T_RESTORE0 -v b=$(date +%s.%N) 'BEGIN{printf "%.1f", b-a}')"
          ls ~/apt-archives 2>/dev/null | wc -l
      - run: bash scripts/ci/_experiments/apt-measure.sh populate custom
      - run: echo "T_SAVE0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Save apt archives
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: apt-measure-643-${{ runner.os }}-${{ env.IMGV }}-${{ hashFiles('package-lock.json') }}
      - run: |
          echo "save seconds=$(awk -v a=$T_SAVE0 -v b=$(date +%s.%N) 'BEGIN{printf "%.1f", b-a}') (skipped if the restore hit)"

  # C: a fresh runner restores the cache and installs again.
  warm:
    name: C warm (restore + install)
    needs: populate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: echo "IMGV=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - run: echo "T_RESTORE0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Restore apt archives
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: apt-measure-643-${{ runner.os }}-${{ env.IMGV }}-${{ hashFiles('package-lock.json') }}
      - run: |
          echo "restore: cache-hit=${{ steps.restore.outputs.cache-hit }} seconds=$(awk -v a=$T_RESTORE0 -v b=$(date +%s.%N) 'BEGIN{printf "%.1f", b-a}')"
          echo "restored debs: $(ls ~/apt-archives/*.deb 2>/dev/null | wc -l)  bytes: $(du -sb ~/apt-archives 2>/dev/null | cut -f1)"
      - run: bash scripts/ci/_experiments/apt-measure.sh warm custom

  # D: restore, then damage the cache in four ways; the install must still succeed and download only what it needs.
  fallback:
    name: D fallback (${{ matrix.mutation }})
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mutation: [corrupt-one, truncate-half, stale-name, empty]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: echo "IMGV=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - name: Restore apt archives
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: apt-measure-643-${{ runner.os }}-${{ env.IMGV }}-${{ hashFiles('package-lock.json') }}
      - run: |
          echo "restore: cache-hit=${{ steps.restore.outputs.cache-hit }}"
          echo "restored debs: $(ls ~/apt-archives/*.deb 2>/dev/null | wc -l)"
      - run: bash scripts/ci/_experiments/apt-measure.sh "fallback-${{ matrix.mutation }}" custom "${{ matrix.mutation }}"
